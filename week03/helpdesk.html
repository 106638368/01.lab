<body>
     <a href="https://www.swinburne.edu.au/" target="_blank"> <img src="logo.png" alt="Swinburne University Logo" > </a>

<h1> CWA Help Desk Appointment </h1>
<form id="helpdesk-form" action="helpdesk.php" method="post">

<p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday </p>
<p>Check Blackboard for when CWA tutors will be there</p>

<fieldset>
		<legend>Students Details</legend>
		<p><label for="Student_ID">Student ID</label> 
			<input type="text" name= "Student_ID" id="Student_ID" maxlength="10" size="10" required="required" pattern="[0-9]{7,10}"/>
        </p>

    	<p><label for="Given_Name">Given Name</label> 
			<input type="text" name= "Given_Name" id="Given_Name" maxlength="10" size="15" required="required" pattern="[A-Za-z]+"/>
        </p>

        <p><label for="family_name">family name</label> 
			<input type="text" name= "family_name" id="family_name" maxlength="10" size="15" required="required" pattern="[A-Za-z]+"/>
        </p>

</fieldset>

<fieldset>
        <legend>Your Unit</legend>
        <p><label for="COS10011">COS10011</label> 
				<input type="radio" id="COS10011" name="unit" value="COS10011" required="required"/>
		</p>

		<p><label for="COS60004">COS60004</label> 
				<input type="radio" id="COS60004" name="unit" value="COS60004"/>
		</p>

        <p><label for="COS60007">COS60007</label> 
				<input type="radio" id="COS60007" name="unit" value="COS60007"/>
		</p>

		<p><label for="Your_Tutor">Your Tutor</label> 
            <select name="Your_Tutor" id="Your_Tutor" required="required">             
				<option value=""> Please Select </option>	
				<option value="Joyce"> Joyce </option>			
				<option value=" Matthew"> Matthew </option>
				<option value="Bruce"> Bruce</option>
				<option value="Sunny"> Sunny </option>
			</select>
        </p>
        
</fieldset>


<fieldset>
            <legend>Issue</legend>

        <p><label for="html">HTML</label> 
				<input type="checkbox" id="html" name="issue[]" value="html" checked="checked"/>
        </p>

        <p><label for="css">CSS</label> 
				<input type="checkbox" id="css" name="issue[]" value="css"/>
		</p>

		<p><label for="javascript">JavaScript</label> 
				<input type="checkbox" id="javascript" name="issue[]" value="javascript"/>
		</p>

		<p><label for="php">PHP</label> 
				<input type="checkbox" id="php" name="issue[]" value="php"/>
		</p>

        <p><label for="mysql">MySQL</label> 
				<input type="checkbox" id="mysql" name="issue[]" value="mysql"/>
		</p>

        <p><label for="description">Description of Issue</label><br />
        <textarea id="description" name="description" rows="4" cols="40" placeholder="Write description of your problem here..."></textarea>
        </p>
</fieldset>

<fieldset>
        <legend>Preferred Date/Time</legend>

    <p><label for="date">Date</label> 
			<input type="text" name= "date" id="Date" placeholder="dd-mm-yyyy" pattern="\d{2}/\d{2}/\d{4}" maxlength="10" size="10"/>
	</p>

    <p>
        <label for="time">Time</label>
        <input type="text" name="time" id="time" placeholder="00:00" pattern="\d{2}:\d{2}" maxlength="5" size="10" />
    </p>

</fieldset>
    <p>
        <input type="submit" value="Book" />
        <input type="reset" value="Reset form" />
    </p>
</form>
</body>
</html>
